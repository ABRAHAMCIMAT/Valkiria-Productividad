# Configuración de Sonar compartida por SonarQube Cloud (CI) y SonarQube Community (local).
# Documentación: docs/08-calidad-sonar.md · Decisión: docs/adr/ADR-0013-calidad-sonar.md
#
# La organización y la clave del proyecto NO van aquí: CI las toma de las variables del
# repositorio y el script local usa las suyas. sonar.sources y sonar.tests los calcula
# tools/sonar/sources.sh según los módulos que existan (el código del fork de Jan se excluye
# a propósito: solo se analiza el código propio de Valkiria).

sonar.projectName=Valkiria Productividad
sonar.sourceEncoding=UTF-8
sonar.links.scm=https://github.com/ABRAHAMCIMAT/Valkiria-Productividad

# --- Python (Valkiria Core) ---
sonar.python.version=3.15
sonar.python.coverage.reportPaths=core/reports/coverage.xml,core/reports/coverage-tools.xml,llmops/reports/coverage.xml
sonar.python.xunit.reportPath=core/reports/junit.xml
sonar.python.ruff.reportPaths=core/reports/ruff.json,llmops/reports/ruff.json
sonar.python.bandit.reportPaths=core/reports/bandit.json,llmops/reports/bandit.json
sonar.python.mypy.reportPaths=core/reports/mypy.txt,llmops/reports/mypy.txt

# --- TypeScript (valkiria-extension) ---
sonar.javascript.lcov.reportPaths=apps/desktop/extensions/valkiria-extension/reports/lcov.info
sonar.eslint.reportPaths=apps/desktop/extensions/valkiria-extension/reports/eslint.json

# --- Alcance ---
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/__pycache__/**,**/*.min.js,**/migrations/versions/**,**/reports/**,tools/tests/**,**/.venv/**
sonar.test.inclusions=**/tests/**,**/test_*.py,**/*_test.py,**/*.test.ts,**/*.spec.ts,**/*.test.tsx
sonar.coverage.exclusions=**/tests/**,**/conftest.py,**/__main__.py,**/*.test.ts,**/*.spec.ts
sonar.cpd.exclusions=**/migrations/**,**/tests/fixtures/**

# --- Quality Gate: el análisis falla si el gate no pasa ---
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
