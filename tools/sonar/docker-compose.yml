# SonarQube Community Build local para Valkiria (solo escucha en 127.0.0.1).
# Uso: cp tools/sonar/.env.example tools/sonar/.env  → editar contraseña → 
#      docker compose -f tools/sonar/docker-compose.yml --env-file tools/sonar/.env up -d
# RAM: ~3.5 GB mientras corre. Apágalo con "down" cuando no lo uses.
name: valkiria-sonar

services:
  sonarqube:
    image: sonarqube:26.10.0.133078-community
    depends_on:
      db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:?Define SONAR_DB_PASSWORD en tools/sonar/.env}
      # Evita tener que ajustar vm.max_map_count en Docker Desktop (macOS/Windows).
      SONAR_SEARCH_JAVAADDITIONALOPTS: "-Dnode.store.allow_mmap=false"
      SONAR_TELEMETRY_ENABLE: "false"
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    mem_limit: 3g
    restart: unless-stopped

  db:
    image: postgres:17.11
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?Define SONAR_DB_PASSWORD en tools/sonar/.env}
      POSTGRES_DB: sonar
    volumes:
      - sonar_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 5s
      retries: 10
    mem_limit: 512m
    restart: unless-stopped

volumes:
  sonar_data:
  sonar_extensions:
  sonar_logs:
  sonar_pg:
