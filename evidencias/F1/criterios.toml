# comandos.rs, y la cadena de auditoría de auditoria.rs. Vitest: «CA-04.1» de PerfilHardware.test.tsx.
# Ninguna sale en JUnit, así que la evidencia automática son los jobs que las corren.
pruebas = []
jobs = ["Build macOS (arm64)", "Pruebas de la app (vitest)"]

