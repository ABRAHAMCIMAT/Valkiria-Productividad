# Reintenta una sola vez los jobs que fallan porque GitHub no asignó un runner ("The job was not
# acquired by Runner of type hosted even after multiple attempts"), algo frecuente con macOS arm64.
# Cualquier otra falla se deja como está: un error real no se reintenta para ocultarlo.
#
# workflow_run corre con el código de main y no hace checkout del código de la corrida que revisa,
# así que no ejecuta nada del PR; solo consulta la API y pide el reintento.
name: Reintento por capacidad de runners

on:
  workflow_run:
    workflows: [CI, Desktop, Sonar, Spike dependencias, Scorecard]
    types: [completed]

permissions:
  contents: read

jobs:
  reintentar:
    name: Reintentar si faltó runner
    if: >-
      contains(fromJSON('["failure", "cancelled"]'), github.event.workflow_run.conclusion) &&
      github.event.workflow_run.run_attempt < 2
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      checks: read
    steps:
      - name: Revisar la causa y reintentar
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          sin_runner=0
          for job in $(gh api "repos/$REPO/actions/runs/$RUN/jobs?per_page=100" \
                         --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled") | .id'); do
            if gh api "repos/$REPO/check-runs/$job/annotations" --jq '.[].message' \
                 | grep -q "was not acquired by Runner"; then
              sin_runner=1
            fi
          done
          if [[ $sin_runner -eq 1 ]]; then
            echo "Falla por falta de runners de GitHub: se reintentan los jobs fallidos de la corrida $RUN."
            gh run rerun "$RUN" --failed --repo "$REPO"
          else
            echo "La corrida $RUN no falló por falta de runners; no se reintenta."
          fi
