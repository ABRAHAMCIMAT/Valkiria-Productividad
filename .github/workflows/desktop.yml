# Build y prueba de humo de la app de escritorio Valkiria (HU-01: CA-01.1 y CA-01.3).
#
# Para cuidar los minutos de macOS (riesgo R-08) no corre en cada PR: corre en main, cada noche,
# a mano y en los PRs con la etiqueta "build-desktop".
#
# F0 compila la app completa con la marca, bun/uv reales e instaladores, pero con el motor de
# inferencia (llama.cpp/MLX) como stub: el motor real se compila desde F1 (HU-04, HU-05).
# Ver apps/desktop/VALKIRIA.md y ADR-0001.
#
# macOS (decisión R-12, 2026-11-11): solo Apple Silicon M4 o posterior con macOS 27.2+. El .app es
# arm64 y declara LSMinimumSystemVersion 27.2, así que los runners de GitHub (M1/M2, macOS 15) lo
# compilan y verifican, pero no pueden abrirlo: la prueba de humo de macOS corre en un Mac M4 con
# tools/desktop/humo-mac-local.sh, que descarga el artefacto de este workflow.
name: Desktop

on:
  push:
    branches: [main]
    paths: ["apps/desktop/**", "tools/desktop/**", ".github/workflows/desktop.yml"]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      segundos:
        description: "Segundos de observación de red en la prueba de humo (CA-01.3 pide 300)"
        default: "300"

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: "--max-old-space-size=4196"
  SEGUNDOS: ${{ inputs.segundos || '300' }}

jobs:
  marca:
    name: Marca aplicada
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'build-desktop')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verificar que la marca y la configuración de Valkiria están aplicadas
        run: python3 tools/desktop/rebrand.py --check

  pruebas-web:
    # Suites de vitest de @janhq/core, web-app y extensiones, adaptadas a la marca. Corre en Linux
    # para no gastar minutos de macOS; TZ=UTC porque formatDate.test.ts depende de la zona horaria.
    name: Pruebas de la app (vitest)
    needs: marca
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/desktop
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: Yarn 4.5.3
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
      - name: Dependencias, APIs de plugins, core y extensiones
        run: |
          yarn install --immutable
          yarn build:tauri:plugin:api
          yarn build:core
          yarn build:extensions
      - name: Pruebas de core, web-app y extensiones
        run: yarn test

  build-macos:
    name: Build macOS (arm64)
    needs: marca
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: Yarn 4.5.3 y Rust (rust-toolchain.toml)
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
          yarn config set -H enableImmutableInstalls false
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-darwin
      - name: Dependencias, core y extensiones
        run: make install-and-build
      - name: Íconos, licencia, bun/uv y motor stub
        run: |
          yarn build:icon
          yarn copy:assets:tauri
          yarn download:bin
          node scripts/stub-tauri-resources.mjs
      # Solo el .app: el .dmg (bundle_dmg.sh) falla en los runners de GitHub. CI valida el .app y lo
      # empaqueta como zip; el .dmg firmado y notarizado llega con la distribución (F10, HU-26).
      - name: Compilar la app (aarch64-apple-darwin, sin firma)
        run: yarn tauri build --target aarch64-apple-darwin --bundles app
      - name: Verificar arquitectura y macOS mínimo (sin abrir la app)
        working-directory: apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos
        run: |
          app="Valkiria Productividad.app"
          archs=$(lipo -archs "$app/Contents/MacOS/Valkiria-Productividad")
          minimo=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")
          echo "Arquitecturas: $archs · LSMinimumSystemVersion: $minimo" | tee -a "$GITHUB_STEP_SUMMARY"
          [[ $archs == arm64 ]] || { echo "::error::Se esperaba solo arm64 y hay: $archs"; exit 1; }
          [[ $minimo == 27.2 ]] || { echo "::error::Se esperaba LSMinimumSystemVersion 27.2 y hay: $minimo"; exit 1; }
      - name: Empaquetar la .app
        run: |
          cd src-tauri/target/aarch64-apple-darwin/release/bundle
          ditto -c -k --keepParent "macos/Valkiria Productividad.app" "$RUNNER_TEMP/Valkiria-Productividad-macos.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: valkiria-macos-arm64
          path: ${{ runner.temp }}/Valkiria-Productividad-macos.zip
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Build y humo Windows x64
    needs: marca
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: Yarn 4.5.3 y Rust (rust-toolchain.toml)
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
          yarn config set -H enableImmutableInstalls false
          rustup show active-toolchain || rustup toolchain install
      - name: Dependencias, core y extensiones
        run: |
          yarn install
          yarn build:tauri:plugin:api
          yarn build:core
          yarn build:extensions
      - name: Íconos, licencia, bun/uv y motor stub
        run: |
          yarn build:icon
          yarn copy:assets:tauri
          yarn download:bin
          node scripts/stub-tauri-resources.mjs
      - name: Compilar la app e instaladores (MSI y NSIS, sin firma)
        run: yarn tauri build
      - name: Instalar el MSI en silencio
        shell: pwsh
        run: |
          $msi = Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1
          Write-Host "Instalando $($msi.Name)"
          $p = Start-Process msiexec.exe -ArgumentList '/i', "`"$($msi.FullName)`"", '/qn', '/l*v', "$env:RUNNER_TEMP\msi.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\msi.log" -Tail 50; exit $p.ExitCode }
          $exe = Get-ChildItem "$env:ProgramFiles\Valkiria Productividad" -Filter *.exe -Recurse | Where-Object Name -like 'Valkiria*' | Select-Object -First 1
          "VALKIRIA_EXE=$($exe.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Vaciar la caché DNS
        shell: pwsh
        run: Clear-DnsClientCache
      - name: Prueba de humo (identidad, arranque y red)
        working-directory: .
        run: python tools/desktop/smoke.py --app "$VALKIRIA_EXE" --segundos "$SEGUNDOS" --salida reports/smoke
      - name: Nombres DNS resueltos (diagnóstico de CA-01.3)
        if: always()
        working-directory: .
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force reports/smoke | Out-Null
          Get-DnsClientCache | Select-Object -ExpandProperty Entry | Sort-Object -Unique |
            Tee-Object -FilePath reports/smoke/dns-windows.txt
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: valkiria-windows-x64
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            reports/smoke/
          retention-days: 30
