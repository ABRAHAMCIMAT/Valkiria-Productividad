# Build y prueba de humo de la app de escritorio Valkiria (HU-01: CA-01.1 y CA-01.3).
#
# Para cuidar los minutos de macOS (riesgo R-08) no corre en cada PR: corre en main, cada noche,
# a mano y en los PRs con la etiqueta "build-desktop".
#
# F0 compila la app completa con la marca, bun/uv reales e instaladores, pero con el motor de
# inferencia (llama.cpp/MLX) como stub: el motor real se compila desde F1 (HU-04, HU-05).
# Ver apps/desktop/VALKIRIA.md y ADR-0001.
name: Desktop

on:
  push:
    branches: [main]
    paths: ["apps/desktop/**", "tools/desktop/**", ".github/workflows/desktop.yml"]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      segundos:
        description: "Segundos de observación de red en la prueba de humo (CA-01.3 pide 300)"
        default: "300"

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: "--max-old-space-size=4196"
  SEGUNDOS: ${{ inputs.segundos || '300' }}

jobs:
  marca:
    name: Marca aplicada
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'build-desktop')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verificar que la marca y la configuración de Valkiria están aplicadas
        run: python3 tools/desktop/rebrand.py --check

  build-macos:
    name: Build macOS (universal)
    needs: marca
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: Yarn 4.5.3 y Rust (rust-toolchain.toml)
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
          yarn config set -H enableImmutableInstalls false
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Dependencias, core y extensiones
        run: make install-and-build
      - name: Íconos, licencia, bun/uv y motor stub
        run: |
          yarn build:icon
          yarn copy:assets:tauri
          yarn download:bin
          node scripts/stub-tauri-resources.mjs
      - name: Compilar la app (universal-apple-darwin, sin firma)
        run: yarn tauri build --target universal-apple-darwin
      - name: Empaquetar la .app
        run: |
          cd src-tauri/target/universal-apple-darwin/release/bundle
          ditto -c -k --keepParent "macos/Valkiria Productividad.app" "$RUNNER_TEMP/Valkiria-Productividad-macos.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: valkiria-macos-universal
          path: |
            ${{ runner.temp }}/Valkiria-Productividad-macos.zip
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 30

  humo-macos:
    name: Humo macOS · ${{ matrix.etiqueta }}
    needs: build-macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, etiqueta: arm64 }
          - { os: macos-15-intel, etiqueta: x64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: valkiria-macos-universal
          path: ${{ runner.temp }}/app
      - name: Instalar en /Applications
        run: |
          zip=$(find "$RUNNER_TEMP/app" -name 'Valkiria-Productividad-macos.zip' -print -quit)
          ditto -x -k "$zip" /Applications
          xattr -dr com.apple.quarantine "/Applications/Valkiria Productividad.app" || true
          lipo -archs "/Applications/Valkiria Productividad.app/Contents/MacOS/Valkiria-Productividad"
      - name: Capturar consultas DNS durante la prueba
        run: |
          sudo tcpdump -i any -n -l 'udp port 53' > "$RUNNER_TEMP/dns.txt" 2>/dev/null &
          echo $! > "$RUNNER_TEMP/tcpdump.pid"
          sleep 2
      - name: Prueba de humo (identidad, arranque y red)
        run: python3 tools/desktop/smoke.py --app "/Applications/Valkiria Productividad.app" --segundos "$SEGUNDOS" --salida reports/smoke
      - name: Nombres DNS consultados (diagnóstico de CA-01.3)
        if: always()
        run: |
          sudo pkill -f "tcpdump -i any" || true
          mkdir -p reports/smoke
          grep -oE '(A|AAAA)\? [^ ]+' "$RUNNER_TEMP/dns.txt" | awk '{print $2}' | sort | uniq -c | sort -rn \
            | tee "reports/smoke/dns-macos-${{ matrix.etiqueta }}.txt"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: humo-macos-${{ matrix.etiqueta }}
          path: reports/smoke/
          retention-days: 90

  windows:
    name: Build y humo Windows x64
    needs: marca
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: Yarn 4.5.3 y Rust (rust-toolchain.toml)
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
          yarn config set -H enableImmutableInstalls false
          rustup show active-toolchain || rustup toolchain install
      - name: Dependencias, core y extensiones
        run: |
          yarn install
          yarn build:tauri:plugin:api
          yarn build:core
          yarn build:extensions
      - name: Íconos, licencia, bun/uv y motor stub
        run: |
          yarn build:icon
          yarn copy:assets:tauri
          yarn download:bin
          node scripts/stub-tauri-resources.mjs
      - name: Compilar la app e instaladores (MSI y NSIS, sin firma)
        run: yarn tauri build
      - name: Instalar el MSI en silencio
        shell: pwsh
        run: |
          $msi = Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1
          Write-Host "Instalando $($msi.Name)"
          $p = Start-Process msiexec.exe -ArgumentList '/i', "`"$($msi.FullName)`"", '/qn', '/l*v', "$env:RUNNER_TEMP\msi.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\msi.log" -Tail 50; exit $p.ExitCode }
          $exe = Get-ChildItem "$env:ProgramFiles\Valkiria Productividad" -Filter *.exe -Recurse | Where-Object Name -like 'Valkiria*' | Select-Object -First 1
          "VALKIRIA_EXE=$($exe.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Vaciar la caché DNS
        shell: pwsh
        run: Clear-DnsClientCache
      - name: Prueba de humo (identidad, arranque y red)
        working-directory: .
        run: python tools/desktop/smoke.py --app "$VALKIRIA_EXE" --segundos "$SEGUNDOS" --salida reports/smoke
      - name: Nombres DNS resueltos (diagnóstico de CA-01.3)
        if: always()
        working-directory: .
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force reports/smoke | Out-Null
          Get-DnsClientCache | Select-Object -ExpandProperty Entry | Sort-Object -Unique |
            Tee-Object -FilePath reports/smoke/dns-windows.txt
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: valkiria-windows-x64
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            reports/smoke/
          retention-days: 30
