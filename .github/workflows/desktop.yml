# Build y prueba de humo de la app de escritorio Valkiria (HU-01: CA-01.1 y CA-01.3).
#
# Para cuidar los minutos de macOS (riesgo R-08) no corre en cada PR: corre en main, cada noche,
# a mano y en los PRs con la etiqueta "build-desktop".
#
# Compila la app completa con la marca, bun/uv reales e instaladores, y desde F1 (incremento 1.1)
# con el motor de inferencia real: llama.cpp con Metal en macOS y con CUDA 13, Vulkan y las
# variantes de CPU (AVX2 entre ellas) en Windows. El motor va dentro del instalador; la app no
# descarga backends en tiempo de ejecución (R-15). MLX sigue como stub (fuera del alcance de F1).
# Ver apps/desktop/VALKIRIA.md y ADR-0001.
#
# macOS (decisión R-12, 2026-11-11): solo Apple Silicon M4 o posterior con macOS 27.2+. El .app es
# arm64 y declara LSMinimumSystemVersion 27.2, así que los runners de GitHub (M1/M2, macOS 15) lo
# compilan y verifican, pero no pueden abrirlo: la prueba de humo de macOS corre en un Mac M4 con
# tools/desktop/humo-mac-local.sh, que descarga el artefacto de este workflow.
name: Desktop

on:
  push:
    branches: [main]
    paths: ["apps/desktop/**", "tools/desktop/**", ".github/workflows/desktop.yml"]
  # Sin "opened": al abrir un PR con la etiqueta, GitHub manda opened y labeled, y la segunda corrida
  # cancelaba la primera (check "cancelled" en rojo). labeled basta para el primer build.
  pull_request:
    types: [synchronize, reopened, labeled]
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      segundos:
        description: "Segundos de observación de red en la prueba de humo (CA-01.3 pide 300)"
        default: "300"

permissions:
  contents: read

# En los PR una corrida nueva reemplaza a la anterior. En main no se cancela nada: el push de una
# fusión y la corrida programada comparten grupo, y la programada cancelaba la del push (2026-11-13,
# PR #19), dejando el commit fusionado sin su build. Ahí esperan en cola.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_OPTIONS: "--max-old-space-size=4196"
  SEGUNDOS: ${{ inputs.segundos || '300' }}

jobs:
  marca:
    name: Marca aplicada
    # En un PR: solo con la etiqueta build-desktop, y si el evento es labeled, solo por esa etiqueta.
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'build-desktop') &&
       (github.event.action != 'labeled' || github.event.label.name == 'build-desktop'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verificar que la marca y la configuración de Valkiria están aplicadas
        run: python3 tools/desktop/rebrand.py --check

  build-macos:
    name: Build macOS (arm64)
    needs: marca
    runs-on: macos-15
    timeout-minutes: 150
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: Yarn 4.5.3 y Rust (rust-toolchain.toml)
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
          yarn config set -H enableImmutableInstalls false
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-darwin
      - name: Dependencias, core y extensiones
        run: make install-and-build
      # Antes del stub: stub-tauri-resources.mjs nunca pisa un archivo que ya existe.
      - name: Motor real · llama.cpp con Metal
        env:
          JAN_ENGINE_VARIANT: metal
        run: make build-engine
      - name: Íconos, licencia, bun/uv y stub de MLX
        run: |
          yarn build:icon
          yarn copy:assets:tauri
          yarn download:bin
          node scripts/stub-tauri-resources.mjs
      # Solo el .app: el .dmg (bundle_dmg.sh) falla en los runners de GitHub. CI valida el .app y lo
      # empaqueta como zip; el .dmg firmado y notarizado llega con la distribución (F10, HU-26).
      - name: Compilar la app (aarch64-apple-darwin, sin firma)
        run: yarn tauri build --target aarch64-apple-darwin --bundles app
      - name: Verificar arquitectura y macOS mínimo (sin abrir la app)
        working-directory: apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos
        run: |
          app="Valkiria Productividad.app"
          archs=$(lipo -archs "$app/Contents/MacOS/Valkiria-Productividad")
          minimo=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")
          echo "Arquitecturas: $archs · LSMinimumSystemVersion: $minimo" | tee -a "$GITHUB_STEP_SUMMARY"
          [[ $archs == arm64 ]] || { echo "::error::Se esperaba solo arm64 y hay: $archs"; exit 1; }
          [[ $minimo == 27.2 ]] || { echo "::error::Se esperaba LSMinimumSystemVersion 27.2 y hay: $minimo"; exit 1; }
          worker=$(find "$app/Contents" -name jan-llama-worker -type f | head -1)
          [[ -n $worker && $(wc -c < "$worker") -gt 1000000 ]] || { echo "::error::La .app no trae el motor real"; exit 1; }
          echo "Motor en la .app: ${worker#"$app/"} ($(wc -c < "$worker" | tr -d ' ') bytes)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Empaquetar la .app
        run: |
          cd src-tauri/target/aarch64-apple-darwin/release/bundle
          ditto -c -k --keepParent "macos/Valkiria Productividad.app" "$RUNNER_TEMP/Valkiria-Productividad-macos.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: valkiria-macos-arm64
          path: ${{ runner.temp }}/Valkiria-Productividad-macos.zip
          if-no-files-found: error
          retention-days: 30
      # Pruebas de Rust: descargas (ninguna va al espejo de Jan, anexo §12), rutas de la app
      # (carpeta e identificador de Valkiria, no los de Jan, anexo §13) y el perfil de hardware con
      # su log de auditoría (HU-04, CA-04.1 y CA-04.2). Van después de subir el artefacto para que
      # esté disponible aunque fallen. Compilan en modo prueba.
      - name: Pruebas de Rust · descargas, rutas de la app y perfil de hardware
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked --lib -- core::downloads core::app core::valkiria
      - name: Verificar el motor empaquetado (no es stub, arranca y lista dispositivos)
        working-directory: .
        run: tools/desktop/motor.sh verificar metal
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
      - name: Modelo de humo del catálogo (caché por SHA-256)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/valkiria/modelos
          key: modelo-humo-${{ hashFiles('llmops/models/catalog.yaml') }}
      - name: Prueba de humo del motor · carga un GGUF del catálogo y genera texto
        working-directory: .
        run: tools/desktop/motor.sh humo metal
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: motor-macos-arm64
          path: |
            reports/motor/
            apps/desktop/src-tauri/target/engine-build.log
          if-no-files-found: warn
          retention-days: 30

  windows:
    name: Build y humo Windows x64
    needs: marca
    runs-on: windows-2022
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: Yarn 4.5.3 y Rust (rust-toolchain.toml)
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
          yarn config set -H enableImmutableInstalls false
          rustup show active-toolchain || rustup toolchain install
      - name: Dependencias, core y extensiones
        run: |
          yarn install
          yarn build:tauri:plugin:api
          yarn build:core
          yarn build:extensions
      - name: Toolchain del motor (CUDA 13, Vulkan SDK, ninja y clang)
        uses: ./.github/actions/motor-windows
      # CUDA + Vulkan + variantes de CPU (GGML_CPU_ALL_VARIANTS, AVX2 entre ellas) en un solo worker:
      # ggml elige el backend al cargar. Antes del stub, que nunca pisa un archivo que ya existe.
      - name: Motor real · llama.cpp con CUDA 13, Vulkan y CPU
        env:
          JAN_ENGINE_VARIANT: cuda13-vulkan
        run: make build-engine
      - name: Verificar el motor empaquetado (no es stub, arranca y lista dispositivos)
        working-directory: .
        run: tools/desktop/motor.sh verificar cuda13-vulkan
      - name: Íconos, licencia, bun/uv y stub de MLX
        run: |
          yarn build:icon
          yarn copy:assets:tauri
          yarn download:bin
          node scripts/stub-tauri-resources.mjs
      - name: Compilar la app e instaladores (MSI y NSIS, sin firma)
        run: yarn tauri build
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
      - name: Modelo de humo del catálogo (caché por SHA-256)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/valkiria/modelos
          key: modelo-humo-${{ hashFiles('llmops/models/catalog.yaml') }}
      - name: Prueba de humo del motor · carga un GGUF del catálogo y genera texto
        working-directory: .
        run: tools/desktop/motor.sh humo cuda13-vulkan
      - name: Instalar el MSI en silencio
        shell: pwsh
        run: |
          $msi = Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1
          Write-Host "Instalando $($msi.Name)"
          $p = Start-Process msiexec.exe -ArgumentList '/i', "`"$($msi.FullName)`"", '/qn', '/l*v', "$env:RUNNER_TEMP\msi.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\msi.log" -Tail 50; exit $p.ExitCode }
          $exe = Get-ChildItem "$env:ProgramFiles\Valkiria Productividad" -Filter *.exe -Recurse | Where-Object Name -like 'Valkiria*' | Select-Object -First 1
          "VALKIRIA_EXE=$($exe.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Vaciar la caché DNS
        shell: pwsh
        run: Clear-DnsClientCache
      - name: Prueba de humo (identidad, arranque y red)
        working-directory: .
        run: python tools/desktop/smoke.py --app "$VALKIRIA_EXE" --segundos "$SEGUNDOS" --salida reports/smoke
      - name: Nombres DNS resueltos (diagnóstico de CA-01.3)
        if: always()
        working-directory: .
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force reports/smoke | Out-Null
          Get-DnsClientCache | Select-Object -ExpandProperty Entry | Sort-Object -Unique |
            Tee-Object -FilePath reports/smoke/dns-windows.txt
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: valkiria-windows-x64
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            reports/smoke/
            reports/motor/
          retention-days: 30
