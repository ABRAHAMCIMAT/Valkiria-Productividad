# Spike R-01 y R-11 (ADR-0002): ¿las dependencias nativas críticas instalan con Python 3.15 en cada
# plataforma sin compilar nada? Se ejecuta a mano y cada semana; el resultado alimenta la contingencia
# 3.14 documentada en el ADR.
name: Spike dependencias

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  wheels:
    name: ${{ matrix.etiqueta }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
        python: ["3.15", "3.14"]
        include:
          - { os: macos-15, etiqueta: macos-arm64 }
          - { os: windows-2022, etiqueta: windows-x64 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar cada dependencia con wheels para todo lo nativo
        # tools/deps/solo-wheels.sh resuelve el árbol y exige wheel a cada dependencia, salvo las de
        # respaldo puro verificado (pyyaml). Las pilas que Valkiria usa de verdad van con sus extras.
        env:
          COMUNES: >-
            lancedb pyinstaller torch pyarrow numpy tokenizers pydantic-core watchfiles
            presidio-analyzer spacy mlflow-skinny langgraph langchain-text-splitters
            sentence-transformers
            docling-slim[convert-core,format-pdf,format-office,format-html,format-markdown,models-local]
            tesserocr
            onnxruntime fastembed rapidocr docling langchain-docling
          MACOS: docling-slim[feat-ocr-mac] ocrmac
        run: |
          echo "paquete,plataforma,python,resultado,version,detalle" > resultado.csv
          paquetes="$COMUNES"
          [[ "${{ runner.os }}" == macOS ]] && paquetes="$paquetes $MACOS"
          # shellcheck disable=SC2086  # la lista se separa por espacios a propósito
          bash tools/deps/solo-wheels.sh "${{ matrix.python }}" "${{ matrix.etiqueta }}" $paquetes \
            | tee -a resultado.csv
          grep -E ',(sin-wheel|sin-resolver),' resultado.csv | while IFS=, read -r p _ _ _ _ causa; do
            echo "::warning title=$p sin wheels::${{ matrix.etiqueta }} Python ${{ matrix.python }}: $causa"
          done || true
          { echo "### ${{ matrix.etiqueta }} · Python ${{ matrix.python }}"; echo '```'; cut -d, -f1-5 resultado.csv | column -s, -t; echo '```'
            echo 'onnxruntime, fastembed, rapidocr, docling completo y langchain-docling se vigilan, pero Valkiria ya no los necesita (R-11, ADR-0009).'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spike-${{ matrix.etiqueta }}-py${{ matrix.python }}
          path: resultado.csv
          retention-days: 90
