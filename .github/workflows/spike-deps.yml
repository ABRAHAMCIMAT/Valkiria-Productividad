# Spike R-01 y R-11 (ADR-0002): ¿las dependencias nativas críticas instalan con Python 3.15 en cada
# plataforma sin compilar nada? Se ejecuta a mano y cada semana; el resultado alimenta la contingencia
# 3.14 documentada en el ADR.
name: Spike dependencias

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  wheels:
    # Un job por sistema operativo con las dos versiones de Python dentro: la mitad de runners de
    # macOS arm64, que GitHub a veces no asigna por falta de capacidad.
    name: Spike · ${{ matrix.etiqueta }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, etiqueta: macos-arm64 }
          - { os: windows-2022, etiqueta: windows-x64 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
      - name: Instalar cada dependencia con wheels para todo lo nativo (3.15 y 3.14)
        # tools/deps/solo-wheels.sh resuelve el árbol y exige wheel a cada dependencia, salvo las de
        # respaldo puro verificado (pyyaml).
        # REQUERIDOS: lo que Valkiria usa. Si alguno no instala, error y el job falla.
        # VIGILADOS: lo que Valkiria dejó de usar por falta de wheels (R-11, ADR-0009). Solo se
        # informa en el resumen, para saber cuándo vuelven a estar disponibles.
        env:
          REQUERIDOS: >-
            lancedb pyinstaller torch pyarrow numpy tokenizers pydantic-core watchfiles
            presidio-analyzer spacy mlflow-skinny langgraph langchain-text-splitters
            sentence-transformers
            docling-slim[convert-core,format-pdf,format-office,format-html,format-markdown,models-local]
            tesserocr
          REQUERIDOS_MACOS: docling-slim[feat-ocr-mac] ocrmac
          VIGILADOS: onnxruntime fastembed rapidocr docling langchain-docling
        run: |
          echo "paquete,plataforma,python,resultado,version,detalle" > requeridos.csv
          cp requeridos.csv vigilados.csv
          requeridos="$REQUERIDOS"
          [[ "${{ runner.os }}" == macOS ]] && requeridos="$requeridos $REQUERIDOS_MACOS"
          for py in 3.15 3.14; do
            # shellcheck disable=SC2086  # las listas se separan por espacios a propósito
            bash tools/deps/solo-wheels.sh "$py" "${{ matrix.etiqueta }}" $requeridos >> requeridos.csv
            # shellcheck disable=SC2086
            bash tools/deps/solo-wheels.sh "$py" "${{ matrix.etiqueta }}" $VIGILADOS >> vigilados.csv
          done
          {
            echo "### ${{ matrix.etiqueta }} · requeridos"; echo '```'; cut -d, -f1-5 requeridos.csv | column -s, -t; echo '```'
            echo "### ${{ matrix.etiqueta }} · vigilados (Valkiria no los usa)"; echo '```'; cut -d, -f1-5 vigilados.csv | column -s, -t; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          fallas=0
          while IFS=, read -r p _ py res _ causa; do
            [[ $res == ok ]] && continue
            echo "::error title=$p sin wheels::${{ matrix.etiqueta }} Python $py: $causa"
            fallas=$((fallas + 1))
          done < <(tail -n +2 requeridos.csv)
          [[ $fallas -eq 0 ]]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: spike-${{ matrix.etiqueta }}
          path: "*.csv"
          retention-days: 90
