# Postura de seguridad del repositorio con OpenSSF Scorecard (docs/04-seguridad.md §5, meta ≥ 7).
# El repositorio es público (D1): los resultados se publican en la API de OpenSSF y quedan además
# como artefacto. Al publicar, el job de Scorecard solo puede usar acciones aprobadas por OpenSSF
# (sin pasos "run"); por eso el resumen corre en un job aparte.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  scorecard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # firma OIDC de los resultados publicados
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.json
          results_format: json
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard
          path: scorecard.json
          retention-days: 90

  resumen:
    needs: scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scorecard
      - name: Resumen
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("scorecard.json"))
          print(f"### OpenSSF Scorecard: {d['score']} / 10\n\n| Check | Puntaje |\n|---|---|")
          for c in sorted(d["checks"], key=lambda c: c["score"]):
              print(f"| {c['name']} | {c['score']} |")
          PY
