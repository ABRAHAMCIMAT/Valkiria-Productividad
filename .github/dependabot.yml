# Actualizaciones de dependencias (SSDF): Actions fijadas por SHA, uv.lock y, desde F2, npm.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: uv
    directories: [/core]
    schedule: { interval: weekly }
    groups:
      python-dev: { dependency-type: development }
