[project]
name = "valkiria-core"
version = "0.0.1"
description = "Valkiria Core: backend local del asistente Valkiria Productividad (VALTRE)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.15,<3.16"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=9",
  "pytest-cov>=7",
  "ruff>=0.15",
  "mypy>=1.20",
  "bandit>=1.9",
  "pip-audit>=2.10",
  "pip-licenses>=5",
  "defusedxml>=0.7",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/valkiria_core"]

[tool.ruff]
extend = "../ruff.toml"

[tool.mypy]
strict = true
python_version = "3.15"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=src --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.bandit]
exclude_dirs = ["tests"]
