[project]
name = "valkiria-llmops"
version = "0.0.1"
description = "LLMOps de Valkiria: MLflow 3, tags de trazabilidad, gate y evidencias por fase."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.15,<3.16"
dependencies = ["mlflow>=3.18,<4"]

[project.scripts]
llmops = "valkiria_llmops.cli:main"

[dependency-groups]
dev = [
  "pytest>=9",
  "pytest-cov>=7",
  "ruff>=0.15",
  "mypy>=1.20",
  "bandit>=1.9",
  "pip-audit>=2.10",
  "pip-licenses>=5",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/valkiria_llmops"]

[tool.ruff]
extend = "../ruff.toml"

[tool.mypy]
strict = true
python_version = "3.15"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["mlflow", "mlflow.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=src --cov-report=term-missing --cov-fail-under=85"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.bandit]
exclude_dirs = ["tests"]
